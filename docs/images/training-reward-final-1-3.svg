<svg xmlns="http://www.w3.org/2000/svg" class="chart" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d">
<title id="t">Mean cumulative reward per episode</title><desc id="d">Line chart of mean cumulative reward over 2 million training steps for three agent types. Prey rises from about -7 to about 10, the alpha hunter stays between 1 and 4, and the hunter stays near 0.</desc>
<style>
  .chart { color-scheme: light dark;
    --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781; --grid:#e1e0d9; --axis:#c3c2b7;
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; }
  @media (prefers-color-scheme: dark) {
    .chart { --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --grid:#2c2c2a; --axis:#383835;
      --s1:#3987e5; --s2:#d95926; --s3:#199e70; } }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .bg { fill: var(--surface); }
  .title { font-size: 17px; font-weight: 600; fill: var(--ink); }
  .sub { font-size: 12.5px; fill: var(--ink2); }
  .tick { font-size: 11.5px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .axt { font-size: 12px; fill: var(--ink2); }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .dot { stroke: var(--surface); stroke-width: 2; }
  .leg { font-size: 12.5px; fill: var(--ink2); }
  .lab { font-size: 12.5px; font-weight: 600; fill: var(--ink); font-variant-numeric: tabular-nums; }</style>
